    <section>
      <h1 class="signheader">Sign-up Page</h1>
      <form id="dForm" class="signform">
        <fieldset>
          <legend>Sign Up</legend><br/>
          <label> Username: 
            <input type="text" name="uname" id="uname" required />
          </label><br/><br/>
          <label> Password :
            <input type="password" name="pword" id="pword" required />
          </label><br/><br/>
          <label> Gender :
            <input type="radio" name="gender" value="Female" /> Female
            <input type="radio" name="gender" value="Male" /> Male
            <input type="radio" name="gender" value="Not Say" /> Prefer Not to Say
          </label><br/><br/>
        </fieldset>  
        <fieldset>
          <legend>Action Buttons</legend>
          <input id="special-button" type="submit" value="Submit">
          <input type="reset" value=" Clear " />
        </fieldset> 
      </form>
      <p class="altsign">Already have an account? <a href="signin.html">Log in here</a></p>
