<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Football Made Easy - Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top navigation -->
  <header>
    <nav class="nav-left">
      <a href="../index.html">Home</a>
    </nav>
    <nav class="nav-center">
      <a href="history.html">History</a>
      <a href="formations.html">Formations</a>
      <a href="rules.html">Rules</a>
      <a href="teams.html">Teams</a>
      <a href="aboutus.html">About Us</a>
    </nav>
    <nav class="right-section">
      <a href="sources.html">Sources</a>
      <a href="accounts.html"><img src="../assets/Football Design.png" alt="Football Logo"></a>
      <span id="authControls"></span>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    <section>
      <h1 class="signheader">Forgot Password</h1>
      <form id="forgotForm" class="signform">
        <fieldset>
          <legend>Reset Your Password</legend><br/>
          <label> Username:
            <input type="text" name="uname" required />
          </label><br/><br/>
          <label> Verification Code:
            <input type="text" name="code" required />
          </label><br/><br/>
          <label> New Password:
            <input type="password" name="newPassword" required />
          </label><br/><br/>
          <label> Confirm Password:
            <input type="password" name="confirmPassword" required />
          </label><br/><br/>
        </fieldset>
        <fieldset>
          <legend>Action Buttons</legend>
          <input type="submit" value="Reset Password">
          <input type="reset" value="Clear" />
          <br/><br/>
        </fieldset>
      </form>
      <p class="altsign">Don’t have an account? <a href="signup.html">Sign up here</a></p>
    </section>
  </main>

  <!-- Footer (reuse your footer) -->
  <footer>
    <div class="social">
      <figure>
        <img src="../assets/facebook-logo.png" alt="Facebook">
        <figcaption>Follow us on Facebook</figcaption>
      </figure>
      <figure>
        <img src="../assets/twitter-x-logo.webp" alt="Twitter/X">
        <figcaption>Follow us on Twitter</figcaption>
      </figure>
    </div>
    <div class="social-right">
      <figure>
        <img src="../assets/Instagram-Logo.png" alt="Instagram">
        <figcaption>Follow us on Instagram</figcaption>
      </figure>
      <div class="copyright">
        © 2025 Football Made Easy. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
